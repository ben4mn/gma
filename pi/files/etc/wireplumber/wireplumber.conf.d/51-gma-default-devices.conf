# Installed by pi/install.sh to /etc/wireplumber/wireplumber.conf.d/.
# Placeholder: which microphone and speaker the frame uses by default.
#
# WirePlumber (0.5, SPA-JSON config) picks the default sink (speaker) and
# source (microphone) by priority. Raising the priority of the right devices
# here survives reboots and re-installs; "wpctl set-default" only writes
# per-user state, which a profile reset or a new kiosk user loses.
#
# 1. Plug in the mic array and the speaker, then on the Pi:
#      K="sudo -u kiosk XDG_RUNTIME_DIR=/run/user/$(id -u kiosk)"
#      $K wpctl status
#    Note the ids under "Sinks:" and "Sources:".
# 2. For each, read its node.name:
#      $K wpctl inspect <id> | grep node.name
#    e.g. alsa_input.usb-SEEED_ReSpeaker_4_Mic_Array__UAC1.0_-00.multichannel-input
#         alsa_output.platform-bcm2835_audio.stereo-fallback   (the Pi 4's 3.5 mm jack)
#         alsa_output.platform-fef00700.hdmi.hdmi-stereo      (HDMI)
# 3. Uncomment the block below and put those names in. A value starting with ~
#    is a REGULAR EXPRESSION (not a shell glob) matched anywhere in the name:
#    write ".*" for "anything", never a bare "*". Then push the kit
#    (pi/remote/push-update.sh: install.sh restarts WirePlumber and the kiosk),
#    or by hand on the Pi:
#      $K systemctl --user restart wireplumber && sudo systemctl restart gma-kiosk
#    Restarting only gma-kiosk is not enough: the kiosk user lingers, so its
#    WirePlumber keeps running and only reads this file when it starts.
# 4. Check: $K wpctl status marks the defaults with a *.
#
# monitor.alsa.rules = [
#   {
#     # The microphone (USB mic array).
#     matches = [ { node.name = "~alsa_input.usb-.*REPLACE_WITH_MIC_NAME.*" } ]
#     actions = { update-props = { priority.session = 3000, priority.driver = 3000 } }
#   }
#   {
#     # The speaker (USB speaker, or the 3.5 mm jack: "~alsa_output.platform-bcm2835_audio.*").
#     matches = [ { node.name = "~alsa_output.usb-.*REPLACE_WITH_SPEAKER_NAME.*" } ]
#     actions = { update-props = { priority.session = 3000, priority.driver = 3000 } }
#   }
#   {
#     # A DSI panel has no HDMI audio; on an HDMI panel without speakers, keep
#     # the silent HDMI sink from ever being picked.
#     matches = [ { node.name = "~alsa_output.platform-.*hdmi.*" } ]
#     actions = { update-props = { node.disabled = true } }
#   }
# ]
