# Installed by pi/install.sh. Defaults for every connection that does not set
# these itself (install.sh also sets them on the existing Wi-Fi profiles).
[connection]
# Retry forever (the default gives up after 4 attempts).
connection.autoconnect-retries=0
# 2 = Wi-Fi power saving off: fewer drops on the Pi's Wi-Fi.
wifi.powersave=2
