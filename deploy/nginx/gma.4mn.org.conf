# gma.4mn.org: cloudflared → nginx (this file) → the app container on 127.0.0.1:8090.
#
#   sudo cp deploy/nginx/gma.4mn.org.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/gma.4mn.org.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS ends at Cloudflare; the tunnel reaches nginx over plain http on this host.
# This file is included inside nginx's http {} block, so the log_format and the
# upstream below live there too (their names are prefixed so they can't clash).
# There is no default_server here on purpose: it only answers for gma.4mn.org.

# Request logs without query strings: pairing (?device=) and sign-in (?t=) links carry secrets.
log_format gma_redacted '$http_cf_connecting_ip - [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent $request_time "$http_user_agent"';

upstream gma_app {
    server 127.0.0.1:8090;   # GMA_HOST_PORT in .env
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name gma.4mn.org;

    access_log /var/log/nginx/gma.access.log gma_redacted;
    error_log  /var/log/nginx/gma.error.log warn;

    # tus uploads arrive in 32 MB chunks (Cloudflare caps a request at 100 MB).
    client_max_body_size 64m;
    client_body_timeout 120s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Cloudflare's own client-IP header, not the spoofable X-Forwarded-For chain:
    # the app's rate limits are per IP.
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    location / {
        proxy_pass http://gma_app;
        # Stream request bodies (tus chunks, voice notes) straight to the app.
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Videos and photos: stream with Range support instead of spooling to temp files.
    location /media/ {
        proxy_pass http://gma_app;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300s;
    }

    # Live updates (SSE): no buffering, and a long read timeout. The app sends a
    # comment every 25 s, under Cloudflare's 100 s idle limit.
    location = /api/events {
        proxy_pass http://gma_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
