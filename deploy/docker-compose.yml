# gma.4mn.org on Ben's homelab. From the repo root:
#
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
#
# (--env-file .env lets GMA_HOST_PORT below come from the same .env the
# containers read.) The project name is fixed to "gma" so its containers,
# network and volumes never collide with Ben's other stacks.

name: gma

x-gma: &gma
  image: gma:latest
  build:
    context: ..
    dockerfile: Dockerfile
  env_file: ../.env
  restart: unless-stopped
  volumes:
    - gma-data:/data
    - gma-media:/media
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  app:
    <<: *gma
    command: ["node", "src/index.js"]
    # Only on the host's loopback: nginx (or cloudflared) is the way in.
    ports:
      - "127.0.0.1:${GMA_HOST_PORT:-8090}:8080"
    stop_grace_period: 15s

  worker:
    <<: *gma
    command: ["node", "src/worker.js"]
    healthcheck:
      test: ["CMD", "node", "scripts/worker-health.js"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # The worker gives a running ffmpeg up to 30 s to finish before it exits.
    stop_grace_period: 40s

volumes:
  gma-data:
  gma-media:
